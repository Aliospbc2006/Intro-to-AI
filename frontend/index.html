<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tokyo Metro Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="map"></div>

    <div class="position-fixed top-0 end-0 p-3 m-3 bg-white rounded shadow-sm border custom-panel">
        <div class="form-check form-switch mb-3 fs-5">
            <input class="form-check-input" type="checkbox" role="switch" id="banModeSwitch">
            <label class="form-check-label" for="banModeSwitch">Ban Mode</label>
        </div>

        <div class="form-check form-switch mb-3 fs-5">
            <input class="form-check-input" type="checkbox" role="switch" id="showBannedSwitch">
            <label class="form-check-label" for="showBannedSwitch">Show Banned</label>
        </div>

        <div class="form-check form-switch mb-3 fs-5">
            <input class="form-check-input" type="checkbox" role="switch" id="showAllSwitch">
            <label class="form-check-label" for="showAllSwitch">Show All</label>
        </div>

        <div class="d-grid gap-2">
            <button class="btn btn-primary" type="button" id="findPathBtn">
                <i class="bi bi-search"></i> Find path
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/load_map.js"></script>
    <script src="js/panel.js"></script>

    <script src="js/ban_mode.js"></script>
    <script src="js/show_banned.js"></script>
    <script src="js/show_all.js"></script>

    <script src="js/find_path.js"></script>

</body>

</html>

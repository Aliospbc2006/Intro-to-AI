<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tokyo Metro Map</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ccircle cx='9' cy='10' r='3' fill='white'/%3E%3Ccircle cx='23' cy='22' r='3' fill='white'/%3E%3Cpath d='M9 10h9a4 4 0 0 1 0 8h-4a4 4 0 0 0 0 4h9' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <header class="brand">
                <div class="brand-logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="5" cy="6" r="2" />
                        <circle cx="19" cy="18" r="2" />
                        <path d="M7 6h6a4 4 0 0 1 0 8h-2a4 4 0 0 0 0 8" transform="translate(0 -3) scale(1 .85)" />
                    </svg>
                </div>
                <div>
                    <h1>Tokyo Metro Map</h1>
                    <p>A* route finder · 9 lines</p>
                </div>
            </header>

            <section class="tools" aria-label="Map tools">
                <label class="toggle">
                    <input type="checkbox" id="showAllSwitch" checked>
                    <span class="track"></span>
                    <span class="t-label">Show All</span>
                </label>
                <label class="toggle">
                    <input type="checkbox" id="showBannedSwitch">
                    <span class="track"></span>
                    <span class="t-label">Show Banned</span>
                </label>
                <label class="toggle toggle-danger">
                    <input type="checkbox" id="banModeSwitch">
                    <span class="track"></span>
                    <span class="t-label">Ban Mode</span>
                </label>
            </section>

            <nav class="tabs" role="tablist" aria-label="Sections">
                <button class="tab on" role="tab" data-tab="path">Path</button>
                <button class="tab" role="tab" data-tab="lines">Lines</button>
                <button class="tab" role="tab" data-tab="segments">Segments</button>
                <button class="tab" role="tab" data-tab="stations">Stations</button>
            </nav>

            <div id="loadError" class="alert alert-error" hidden></div>

            <main class="panels">
                <section id="panel-path" class="panel" data-panel="path"></section>
                <section id="panel-lines" class="panel" data-panel="lines" hidden></section>
                <section id="panel-segments" class="panel" data-panel="segments" hidden></section>
                <section id="panel-stations" class="panel" data-panel="stations" hidden></section>
            </main>
        </aside>

        <div class="map-wrap">
            <div id="map"></div>
            <div id="mapBanner" class="map-banner" hidden></div>
            <div id="toasts" class="toasts" aria-live="polite"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/load_map.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/store.js"></script>
    <script src="js/map_layers.js"></script>
    <script src="js/panel_path.js"></script>
    <script src="js/panel_lines.js"></script>
    <script src="js/panel_lists.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
